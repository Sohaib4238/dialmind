# The server: Caddy (HTTPS) -> frontend + backend. Runs from /srv/dialmind/app (deploy/release.sh copies it there).
# RELEASE_TAG and the switch state come from /srv/dialmind/app/.env (no secrets in that file; switch.sh writes it).
name: dialmind

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  backend:
    <<: *hardening
    image: dialmind-backend:${RELEASE_TAG:?}
    # Never add "ports:" here. DIALER_REQUIRE_LOGIN is the second lock on the same door.
    environment:
      DIALER_ENV_FILE: /srv/dialmind/secrets/.env
      DIALER_DATA_DIR: /srv/dialmind/data
      DIALER_LOG_DIR: /srv/dialmind/logs
      AGENT_SETTINGS_PATH: /srv/dialmind/config/agent_settings.yaml
      DIALER_REQUIRE_LOGIN: "1"
      # Where Cartesia + Telnyx will send everything. Not used while in standby.
      PUBLIC_BASE_URL: https://dialer.example.com
      # The laptop is the live system until `switch.sh live`. Missing or empty = the safe value. These beat anything in
      # secrets/.env (dotenv never overrides).
      DIALER_STANDBY: "${DIALER_STANDBY:-1}"
      CARTESIA_CALLS_DISABLED: "${CARTESIA_CALLS_DISABLED:-1}"
      SMS_SENDING_DISABLED: "${SMS_SENDING_DISABLED:-1}"
      # No switch on purpose: turning on emails is a separate decision.
      EMAIL_SENDING_DISABLED: "1"
      DASHBOARD_DEV: "0"
    volumes:
      - /srv/dialmind/secrets:/srv/dialmind/secrets
      - /srv/dialmind/data:/srv/dialmind/data
      - /srv/dialmind/config:/srv/dialmind/config
      - /srv/dialmind/logs:/srv/dialmind/logs
    mem_limit: 450m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/public/ping', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  frontend:
    <<: *hardening
    image: dialmind-frontend:${RELEASE_TAG:?}
    depends_on: [backend]
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    <<: *hardening
    image: caddy:2-alpine
    depends_on: [backend, frontend]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/dialmind/caddy/data:/data
      - /srv/dialmind/caddy/config:/config
    mem_limit: 150m
